apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-kevin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Heldo1337/Evoilatestapp.git
    targetRevision: main
    path: k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true