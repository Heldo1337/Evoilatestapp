apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-kevin
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-kevin
  template:
    metadata:
      labels:
        app: hello-kevin
    spec:
      containers:
        - name: hello-kevin
          image: heldo1337/hello-kevin:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-kevin-service
  namespace: dev
spec:
  type: NodePort
  selector:
    app: hello-kevin
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
